<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SWIPE PERF HARNESS</title>
    <link href="assets/libs/fontawesome.min.css" rel="stylesheet" />
    <link href="assets/css/tailwind.min.css" rel="stylesheet" />
    <link href="assets/css/style.css" rel="stylesheet" />
    <script src="assets/libs/vue.global.min.js"></script>
    <style>
        body { background: #e5e7eb; padding: 16px; }
    </style>
</head>
<body>
<div id="app">
    <!-- سياق قائمة واقعي: بطاقات ساكنة حول البطاقة المُختبرة -->
    <div class="relative rounded-2xl mb-3 bg-white h-20 opacity-60"></div>

    <!-- بطاقة مطابقة لبنية index.html (خلفيتان + محتوى كامل) -->
    <div class="relative rounded-2xl mb-3">
        <div class="swipe-background swipe-background-left">
            <span class="flex items-center gap-3 text-white font-bold text-lg swipe-content-call">
                <i class="fas fa-phone-alt text-2xl"></i>
                <span>{{ t('parcel.call') }}</span>
            </span>
            <span class="flex items-center gap-3 text-white font-bold text-lg swipe-content-yalidine">
                <img src="assets/icons/yalidine-logo.png" alt="Yalidine" class="h-8 brightness-0 invert" />
            </span>
        </div>

        <div class="swipe-background swipe-background-right">
            <span class="flex items-center gap-3 text-white font-bold text-lg swipe-content-call">
                <i class="fas fa-phone-alt text-2xl"></i>
                <span>{{ t('parcel.call') }}</span>
            </span>
            <span class="flex items-center gap-3 text-white font-bold text-lg swipe-content-yalidine">
                <img src="assets/icons/yalidine-logo.png" alt="Yalidine" class="h-8 brightness-0 invert" />
            </span>
        </div>

        <div class="card-content border-r-4 bg-white"
            @touchstart="touchStart($event, parcel)" @touchmove="touchMove($event)"
            @touchend="touchEnd($event, parcel)" @touchcancel="touchCancel()"
            @pointercancel="onCardPointerCancel()">
            <div class="p-3 cursor-pointer relative">
                <div class="font-bold text-gray-900 text-sm mb-1">{{ parcel.receiver }}</div>
                <div class="text-xs text-gray-500 font-mono">{{ parcel.phone }}</div>
                <div class="text-xs text-gray-400 mt-1">{{ parcel.address }}</div>
            </div>
        </div>
    </div>

    <div class="relative rounded-2xl mb-3 bg-white h-20 opacity-60"></div>
    <div class="relative rounded-2xl mb-3 bg-white h-20 opacity-60"></div>
</div>

<script src="assets/i18n/ar.js"></script>
<script src="assets/i18n/fr.js"></script>
<script src="assets/i18n/en.js"></script>
<script src="assets/i18n/index.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/methods.js"></script>
<script>
    // حماية: لا tel:/window.open/localStorage أثناء القياس — الإجراءات تُرصد فقط
    window.__commits = [];
    appMethods.saveData = function () {};
    appMethods.addNotification = function () {};
    appMethods.callPhone = function (p) { window.__commits.push('call:' + p); };
    appMethods.showSecondPhoneChip = function () {};
    appMethods.openYalidine = function (t) { window.__commits.push('yalidine:' + t); };

    appState.parcels = [
        { id: 1, tracking: 'TR-001', receiver: 'محمد أمين', phone: '0555000111', phone2: '', amount: 2500, status: 'no_action', address: 'حي النصر 12 باب الزوار' },
    ];

    const app = Vue.createApp({
        data() { return appState; },
        computed: { parcel() { return this.parcels[0]; } },
        methods: { ...window.appMethods },
    }).mount('#app');
    window.__app = app;

    // ===== قياس زمن الإطارات أثناء سحب حقيقي الأحداث =====
    window.__measureDrag = function (dir, steps = 60, stepPx = 3) {
        const card = document.querySelector('.card-content');
        const frames = [];
        let last = performance.now();
        const mk = (type, x, y) => {
            const t = new Touch({ identifier: 1, target: card, clientX: x, clientY: y });
            return new TouchEvent(type, {
                touches: type === 'touchend' ? [] : [t],
                targetTouches: type === 'touchend' ? [] : [t],
                changedTouches: [t], bubbles: true, cancelable: true,
            });
        };
        const startX = 300, y = 120;
        card.dispatchEvent(mk('touchstart', startX, y));
        let i = 0;
        return (async () => {
            for (i = 1; i <= steps; i++) {
                await new Promise((res) => requestAnimationFrame(() => {
                    const now = performance.now();
                    frames.push(now - last);
                    last = now;
                    card.dispatchEvent(mk('touchmove', startX + dir * i * stepPx, y + 1));
                    res();
                }));
            }
            card.dispatchEvent(mk('touchend', startX + dir * steps * stepPx, y + 1));
            await new Promise((r) => requestAnimationFrame(r));
            await new Promise((r) => requestAnimationFrame(r));
            const sorted = [...frames].sort((a, b) => a - b);
            const avg = frames.reduce((a, b) => a + b, 0) / frames.length;
            return {
                n: frames.length,
                avg: +avg.toFixed(2),
                p50: +sorted[Math.floor(sorted.length * 0.5)].toFixed(2),
                p95: +sorted[Math.floor(sorted.length * 0.95)].toFixed(2),
                max: +sorted[sorted.length - 1].toFixed(2),
                over32: frames.filter((f) => f > 32).length,
                commits: window.__commits.splice(0),
            };
        })();
    };
</script>
</body>
</html>
